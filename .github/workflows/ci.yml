name: "Security and Audit CI"

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  audit:
    name: "Audit & Integrity Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pip-audit

      - name: Bytecode compilation check
        run: python -m compileall -q .

      - name: Run Sovereign Chaos Tests
        run: python sovereign_chaos_test.py

      - name: Run Core & Airgap Unit Tests
        run: python test_core.py
          python test_airgap.py
          python test_airgap_full.py

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: pip-audit
