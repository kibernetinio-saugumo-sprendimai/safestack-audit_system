name: "Security and Audit CI"

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  audit:
    name: "Audit & Integrity Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Bytecode compilation check
        run: python -m compileall -q -x '(^|/)(\.venv|venv|runtime|__pycache__)(/|$)' .

      - name: Run Sovereign Chaos Tests
        run: python sovereign_chaos_test.py

      - name: Run unit tests and offline regression scripts
        run: |
          python -m unittest discover -v
          python test_core.py
          python test_airgap.py
          python test_airgap_full.py
          python priority_3_hash_chain_audit.py
          python priority_4_immutability_test.py
          python priority_7_lockdown_test.py

      - name: Verify current source checksums
        run: sha256sum --check SHA256SUMS

      - name: Run API and graph compatibility regressions
        run: |
          python test_deployment_cli.py
          python test_api_auth.py
          python test_security_regressions.py

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: pip-audit
